<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="light">

  <!-- ── HEADER ── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="app-title">✦ Life Dashboard</span>
    </div>
    <div class="topbar-right">
      <button id="themeToggle" class="icon-btn" title="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="dashboard">

    <!-- ══ GREETING CARD ══ -->
    <section class="card greeting-card" id="greetingCard">
      <div class="greeting-text">
        <p id="greetingMsg" class="greeting-msg">Good Morning</p>
        <h1 id="greetingName" class="greeting-name">Friend</h1>
      </div>
      <div class="datetime-block">
        <p id="clockDisplay" class="clock">00:00:00</p>
        <p id="dateDisplay" class="date">Monday, 1 January 2000</p>
      </div>
      <!-- inline name edit -->
      <div class="name-edit-row">
        <input id="nameInput" type="text" placeholder="Enter your name…" maxlength="30" />
        <button id="saveName" class="btn btn-sm">Save</button>
      </div>
    </section>

    <!-- ══ POMODORO CARD ══ -->
    <section class="card timer-card">
      <h2 class="card-title">⏱ Focus Timer</h2>

      <div class="timer-settings">
        <label>Work <input id="workMin" type="number" min="1" max="90" value="25" /> min</label>
        <label>Break <input id="breakMin" type="number" min="1" max="30" value="5" /> min</label>
        <button id="applyTimer" class="btn btn-sm">Apply</button>
      </div>

      <div class="timer-mode-tabs">
        <button class="tab-btn active" data-mode="work">Work</button>
        <button class="tab-btn" data-mode="break">Break</button>
      </div>

      <div class="timer-display-wrap">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52" />
          <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="52"
            stroke-dasharray="326.73" stroke-dashoffset="0" />
        </svg>
        <div class="timer-display" id="timerDisplay">25:00</div>
      </div>

      <div class="timer-status" id="timerStatus">Ready</div>

      <div class="timer-controls">
        <button id="startTimer" class="btn btn-primary">▶ Start</button>
        <button id="stopTimer" class="btn">⏸ Pause</button>
        <button id="resetTimer" class="btn">↺ Reset</button>
      </div>

      <p class="session-counter">Sessions today: <span id="sessionCount">0</span></p>
    </section>

    <!-- ══ TODO CARD ══ -->
    <section class="card todo-card">
      <h2 class="card-title">✅ To-Do List</h2>

      <div class="todo-toolbar">
        <div class="todo-add-row">
          <input id="taskInput" type="text" placeholder="What needs to be done?" maxlength="100" />
          <button id="addTask" class="btn btn-primary">Add</button>
        </div>
        <div class="todo-filter-row">
          <span class="filter-label">Filter:</span>
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="done">Done</button>

          <span class="sort-label">Sort:</span>
          <select id="sortSelect" class="sort-select">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="done-last">Done last</option>
            <option value="done-first">Done first</option>
          </select>
        </div>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <div class="todo-footer">
        <span id="taskCounter" class="task-counter">0 tasks left</span>
        <button id="clearDone" class="btn btn-sm btn-danger">Clear done</button>
      </div>
    </section>

    <!-- ══ QUICK LINKS CARD ══ -->
    <section class="card links-card">
      <h2 class="card-title">🔗 Quick Links</h2>

      <div class="link-add-row">
        <input id="linkLabel" type="text" placeholder="Label (e.g. YouTube)" maxlength="20" />
        <input id="linkUrl" type="url" placeholder="https://…" />
        <button id="addLink" class="btn btn-primary">Add</button>
      </div>

      <div id="linkGrid" class="link-grid"></div>
    </section>

  </main>

  <!-- ── EDIT TASK MODAL ── -->
  <div id="editModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Edit task">
    <div class="modal">
      <h3>Edit Task</h3>
      <input id="editInput" type="text" maxlength="100" />
      <div class="modal-actions">
        <button id="saveEdit" class="btn btn-primary">Save</button>
        <button id="cancelEdit" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ── EDIT LINK MODAL ── -->
  <div id="editLinkModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="Edit link">
    <div class="modal">
      <h3>Edit Link</h3>
      <input id="editLinkLabel" type="text" placeholder="Label" maxlength="20" />
      <input id="editLinkUrl" type="url" placeholder="https://…" />
      <div class="modal-actions">
        <button id="saveEditLink" class="btn btn-primary">Save</button>
        <button id="cancelEditLink" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
